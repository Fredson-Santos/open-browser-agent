<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OBA · Permissão</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { padding: 22px 22px 18px; display: flex; flex-direction: column; min-height: 100vh; }
    .kicker { font-size: 11px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
    h1 { font-size: 18px; font-weight: 500; line-height: 1.35; margin-top: 8px; text-wrap: balance; }
    h1 b { overflow-wrap: anywhere; }
    .why { margin-top: 10px; color: var(--muted); font-size: 13px; }
    .actions { margin-top: auto; padding-top: 18px; display: grid; gap: 8px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .files { margin: 8px 0 0; padding: 8px 10px 8px 26px; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
      background: var(--stage); color: var(--text); font: 12px var(--font-mono);
      max-height: 130px; overflow: auto; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <p class="kicker" id="kicker">Pedido de acesso</p>
  <h1 id="title">Carregando…</h1>
  <p class="why" id="why"></p>
  <div class="actions">
    <button class="primary" id="always"></button>
    <div class="row">
      <button id="session"></button>
      <button class="danger" id="deny"></button>
    </div>
  </div>
  <script src="approve.js"></script>
</body>
</html>
